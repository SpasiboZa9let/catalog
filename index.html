<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог ИИ-инструментов</title>
 <link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/layout.css" />
<link rel="stylesheet" href="./css/tools.css" />
<link rel="stylesheet" href="./css/modal.css" />
<link rel="stylesheet" href="./css/responsive.css" />

</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Каталог ИИ-инструментов</h1>
  </header>

  <!-- SEARCH + CATEGORIES -->
  <section class="top-bar">
    <input
      id="search-input"
      type="text"
      placeholder="Поиск инструментов…"
      class="search-input"
    />

    <div id="categories" class="categories"></div>
  </section>
  
  <script>
  window.extraCategories = [
    {
      name: "Только для учителей",
      emoji: "🎓"
    }
  ];
</script>


  <!-- TOOL LIST -->
  <main>
    <div id="tools-list" class="tools-list"></div>
  </main>

  <!-- ====================== MODAL ====================== -->

  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <div id="modal-window" class="modal-window hidden">
    <button id="modal-close" class="modal-close">×</button>

    <h2 id="modal-title"></h2>

    <a id="modal-url" href="#" target="_blank" class="modal-link">
      Открыть инструмент
    </a>

    <p id="modal-summary" class="modal-summary"></p>

    <div id="modal-howto">
      <h3>Как использовать:</h3>
      <ul id="modal-howto-list"></ul>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="./app.js"></script>
</body>
</html>
